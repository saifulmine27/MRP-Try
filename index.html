<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ক্যামেরা স্ক্যানার ও এআই বাজার মূল্য ফাইন্ডার</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- Header -->
    <header class="bg-indigo-600 dark:bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">📸</span>
                <h1 class="text-lg md:text-xl font-bold">বাংলাদেশী বাজার এআই ফাইন্ডার</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleSettings()" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer">
                    ⚙️ এপিআই কি
                </button>
                <button onclick="toggleTheme()" id="themeBtn" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer">
                    🌙 ডার্ক
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
        
        <!-- API Key Box -->
        <div id="settingsBox" class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-md mb-6 border border-slate-200 dark:border-slate-700 hidden">
            <h3 class="font-bold text-base mb-2 text-indigo-600 dark:text-indigo-400">আপনার Gemini API Key সেট করুন</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-3">ক্যামেরা স্ক্যান ও এআই বিশ্লেষণের জন্য আপনার নিজস্ব Google Gemini API Key দিন। এটি শুধুমাত্র আপনার ব্রাউজারের LocalStorage-এ সংরক্ষিত থাকে।</p>
            <div class="flex gap-2">
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="saveApiKey()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer">সংরক্ষণ</button>
            </div>
        </div>

        <!-- Tabs / Options -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-6 mb-8 border border-slate-100 dark:border-slate-700">
            <div class="flex border-b border-slate-200 dark:border-slate-700 mb-6">
                <button onclick="switchTab('text')" id="tabTextBtn" class="flex-1 pb-3 font-semibold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 transition cursor-pointer text-center">
                    ✍️ নাম লিখে খুঁজুন
                </button>
                <button onclick="switchTab('image')" id="tabImageBtn" class="flex-1 pb-3 font-medium text-slate-500 dark:text-slate-400 border-b-2 border-transparent transition cursor-pointer text-center">
                    📷 ছবি বা ক্যামেরা স্ক্যান
                </button>
            </div>

            <!-- Text Search Tab Content -->
            <div id="textContent">
                <label class="block text-base font-semibold mb-2 text-slate-700 dark:text-
